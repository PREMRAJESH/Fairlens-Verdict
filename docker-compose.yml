version: "3.9"
services:
  backend:
    build:
      context: ./fairlens_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./fairlens_backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
